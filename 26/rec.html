<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Portal Login</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #0b4f7c, #0a3d62);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .container {
        background: #fff;
        width: 400%;
        max-width: 480px;
        border-radius: 16px;
        padding: 60px 46px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    }

    .header {
        text-align: center;
        margin-bottom: 35px;
    }

    .header h1 {
        color: #0b4f7c;
        font-size: 28px;
        margin: 0;
    }

    .header p {
        color: #666;
        margin-top: 8px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #0b4f7c;
        font-size: 14px;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 22px;
        font-size: 15px;
        transition: border 0.2s;
    }

    input:focus {
        border-color: #0b4f7c;
        outline: none;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #0b4f7c;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .btn:hover {
        background: #083b5e;
    }

    .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
    }

    .footer a {
        color: #0b4f7c;
        text-decoration: none;
    }

    .footer a:hover {
        text-decoration: underline;

</style>
</head>
